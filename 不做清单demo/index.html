<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="不做清单 · STOP DOING LIST - 一份反多巴胺的时间管理工具。打印今日不要做的事，滑动完成，追踪进步。" />
  <meta name="theme-color" content="#1A1410" />
  <meta property="og:title" content="不做清单 · STOP DOING LIST" />
  <meta property="og:description" content="一份反多巴胺的时间管理工具。打印今日不要做的事，滑动完成，追踪进步。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://stop-doing-list.pages.dev/og-image.png" />
  <meta property="og:url" content="https://stop-doing-list.pages.dev" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231A1410'/><text y='.9em' font-size='90' fill='%237E2625'>不</text></svg>" />
  <title>不做清单 · STOP DOING LIST</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=70" />
  <link rel="stylesheet" href="css/intro.css?v=4" />
  <link rel="stylesheet" href="css/icon-gate.css?v=1" />
  <link rel="stylesheet" href="css/list-tutorial.css?v=1" />
</head>
<body class="intro-pending">
  <!-- 背景画布：点阵生成艺术 -->
  <canvas id="bg-canvas"></canvas>
  <!-- 导航像素圆点图标层：静止时显示，扰动时散开让位文字（pointer-events:none 不拦截点击） -->
  <canvas id="nav-icon-canvas"></canvas>

  <!-- 页面快捷导航 -->
  <nav class="top-nav" id="top-nav">
    <a href="#" class="nav-link conceal-text" data-page="home">HOME</a>
    <a href="#" class="nav-link conceal-text" data-page="list">LISTS</a>
    <a href="#" class="nav-link conceal-text" data-page="time">TIME</a>
    <a href="#" class="nav-link conceal-text" data-page="archive">ARCHIVE</a>
    <a href="#" class="nav-link conceal-text" data-page="stats">STATS</a>
  </nav>

  <!-- 主页：中央打印入口 -->
  <section id="page-home" class="page active">
    <div class="hero-content">
      <div class="brand">
        <span class="brand-line mask-text" data-swap-text="不做清单">STOP DOING</span>
        <h1 class="brand-title mask-text" data-swap-text="STOP-DOING LIST">不做清单</h1>
      </div>
      <div class="printer-slot" id="printer-slot">
        <img class="printer-svg" src="optimized_drawing.svg" alt="loading" />
        <div class="printer-led"></div>
      </div>
      <div class="bottom-actions">
        <img id="print-icon" class="print-icon" src="assets/icon-frames/printer-red/f00.png" alt="打印机" />
        <p id="print-status" class="print-status"></p>
      </div>
    </div>
  </section>

  <!-- 清单层：打印出的清单 -->
  <section id="page-list" class="page">
    <h2 class="page-title"><span>TODAY</span></h2>
    <a href="#" class="back-home-link" data-page="home">BACK TO HOME</a>
    <!-- 页面顶部打印机 -->
    <div class="list-printer" id="list-printer">
      <img class="list-printer-svg" src="optimized_drawing.svg" alt="printer" />
      <!-- 新素材打印机：同时承担打印机视觉+收据遮罩，img 撑开容器高度，收据墙自然紧跟图形底边 -->
      <img class="list-printer-img" src="assets/printer-new.png" alt="打印机" />
      <div class="list-printer-body"></div>
      <div class="list-printer-slot"></div>
      <div class="list-printer-led"></div>
      <!-- 遮罩 DOM 保留（JS .show 计数依赖），background:none 视觉退役 -->
      <div class="printer-mask" id="printer-mask"></div>
    </div>
    <div class="receipt-wall" id="receipt-wall"></div>
  </section>

  <!-- 票夹回顾页：门后空间 · Roam（门序列在 3D 场景内，丝滑穿越） -->
  <section id="page-archive" class="page">
    <h2 class="page-title"><span>ARCHIVE</span></h2>
    <!-- Roam 3D 漫游空间（门也在这个 3D 场景内） -->
    <div class="archive-roam-stage" id="archive-roam-stage">
      <div class="roam-world" id="roam-world">
        <!-- 3D 门：位于相机前方 z=+520 平面，绕右轴旋开，相机穿越门框 -->
        <div class="roam-door-wrap" id="roam-door-wrap">
          <div class="roam-door" id="roam-door" role="button" tabindex="0" aria-label="敲门进入档案室">
            <div class="door-way"></div>
            <div class="door-glow"></div>
            <div class="door-panel" id="door-panel">
              <div class="face front">
                <div class="panel-top"></div>
                <div class="panel-bot"></div>
                <div class="knob"></div>
              </div>
              <div class="face back"></div>
              <div class="edge-l"></div>
              <div class="edge-r"></div>
            </div>
            <div class="door-plate" id="archive-door-year"></div>
            <div class="knock-burst" id="knock-burst" aria-hidden="true"><svg viewBox="0 0 100 100"><g stroke="#F0F0F0" stroke-width="6" stroke-linecap="round"><line x1="50" y1="50" x2="50" y2="14"/><line x1="50" y1="50" x2="75.46" y2="24.54"/><line x1="50" y1="50" x2="86" y2="50"/><line x1="50" y1="50" x2="75.46" y2="75.46"/><line x1="50" y1="50" x2="50" y2="86"/><line x1="50" y1="50" x2="24.54" y2="75.46"/><line x1="50" y1="50" x2="14" y2="50"/><line x1="50" y1="50" x2="24.54" y2="24.54"/></g></svg></div>
            <div class="door-frame"></div>
          </div>
        </div>
        <!-- 收据卡片由 JS 动态挂载 -->
        <div class="roam-cards" id="roam-cards"></div>
      </div>
      <!-- UI 覆盖层：提示（pointer-events:none，不挡 3D 门点击） -->
      <div class="archive-door-ui" id="archive-door-ui">
        <div class="archive-door-hint" id="archive-door-hint">轻点敲门</div>
      </div>
      <div class="roam-empty" id="roam-empty"></div>
      <div class="roam-dim" id="roam-dim"></div>
      <div class="roam-focus-layer" id="roam-focus-layer"></div>
    </div>
    <!-- Browse 占位 -->
    <div class="archive-browse-stage" id="archive-browse-stage"></div>
    <!-- Roam/Browse 切换（仅 ARCHIVE 页） -->
    <div class="archive-mode-switch" id="archive-mode-switch">
      <span class="mode-item active" data-mode="roam">ROAM</span>
      <span class="mode-sep">/</span>
      <span class="mode-item" data-mode="browse">BROWSE</span>
    </div>
  </section>

  <!-- 时光机页 -->
  <section id="page-time" class="page">
    <h2 class="page-title"><span>TIME MACHINE</span></h2>
    <a href="#" class="back-home-link" data-page="home">BACK TO HOME</a>
    <div class="time-stage">
      <p class="time-desc">输入一个坏习惯，看看它未来的快照。</p>
      <div class="time-input-wrap">
        <input id="bad-habit-input" type="text" placeholder="例如：熬夜刷手机、喝第三杯奶茶、无意义会议…" />
        <button id="btn-predict" class="clock-predict-btn" aria-label="生成快照">
          <img id="clock-predict-img" src="assets/icon-frames/clock/frame_001.png" alt="生成快照" />
        </button>
      </div>
      <div id="snapshot-card" class="snapshot-card hidden">
        <div class="snapshot-label">CONSEQUENCE SNAPSHOT</div>
        <div id="snapshot-text" class="snapshot-text"></div>
        <button id="btn-add-today" class="main-btn small">添加到今日清单</button>
      </div>
    </div>
  </section>

  <!-- 统计页：维度×月份 热成像网格 -->
  <section id="page-stats" class="page">
    <h2 class="page-title"><span>DATA</span></h2>
    <a href="#" class="back-home-link" data-page="home">BACK TO HOME</a>
    <div class="data-scroll" id="data-scroll"></div>
  </section>

  <!-- 返回主页按钮 -->
  <button id="btn-home" class="home-btn" aria-label="回到主页">×</button>

  <script src="js/app.js?v=22"></script>
  <script src="js/fluid-bg.js?v=12"></script>
  <script src="js/archive-space.js?v=5"></script>
  <script src="js/nav-pixel-icons.js?v=2"></script>
  <script src="js/intro.js?v=2"></script>
  <!-- 虚拟归档数据库（正式上线时删除此行 + js/virtual-archive.js 文件）-->
  <script src="js/virtual-archive.js?v=1"></script>
  <script src="js/list-tutorial.js?v=1"></script>
  <!-- intro 防闪现兜底：intro.js 加载失败时 4s 后强制恢复主页可见，防永久黑屏 -->
  <script>setTimeout(function(){var b=document.body;if(b&&b.classList.contains('intro-pending')&&!document.getElementById('intro-overlay')){b.classList.remove('intro-pending');}},4000);</script>
</body>
</html>
